# This rule is not used by the project k-belt itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the bestbefore.k-belt.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k-belt
    app.kubernetes.io/managed-by: kustomize
  name: bestbefore-editor-role
rules:
- apiGroups:
  - bestbefore.k-belt.io
  resources:
  - bestbefores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bestbefore.k-belt.io
  resources:
  - bestbefores/status
  verbs:
  - get
