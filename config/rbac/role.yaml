---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - bestbefore.k-belt.io
  resources:
  - bestbefores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bestbefore.k-belt.io
  resources:
  - bestbefores/status
  verbs:
  - get
  - patch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - karpenter.sh
  resources:
  - nodeclaims
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - karpenter.sh
  resources:
  - nodepools
  verbs:
  - get
  - list
  - watch
