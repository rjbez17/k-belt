apiVersion: bestbefore.k-belt.io/v1alpha1
kind: BestBefore
metadata:
  name: e2e
spec:
  nodeClaimSelector:
    matchLabels:
      karpenter.sh/nodepool: default
  maxAge: 60s
  # A count, not a percentage: replacement NodeClaims match the selector too, so a percentage
  # denominator moves during the rollout and the assertion in test.sh could not pin it down.
  maxConcurrent: "3"
  taintDriftedNodes: true
