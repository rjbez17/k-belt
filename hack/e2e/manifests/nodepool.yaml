apiVersion: karpenter.kwok.sh/v1alpha1
kind: KWOKNodeClass
metadata:
  name: default
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.kwok.sh
        kind: KWOKNodeClass
        name: default
      # No expiry: BestBefore owns rotation in this test.
      expireAfter: Never
  limits:
    cpu: "1000"
  disruption:
    # One node at a time, so pacing is observable.
    budgets:
      - nodes: "1"
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1h
