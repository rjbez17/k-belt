name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
      - name: Lint shell scripts
        run: make lint-shell
      - name: Lint documentation
        run: make lint-docs
      - name: Lint the chart and validate rendered manifests
        run: make helm-lint
      - name: Build the documentation site
        run: make docs-build
